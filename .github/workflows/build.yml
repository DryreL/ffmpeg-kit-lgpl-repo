name: Build FFmpegKit LGPL for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout FFmpegKitNext
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v8.1.1
          path: ffmpeg-kit-next

      - name: Setup Environment
        run: |
          brew install autoconf automake libtool pkg-config cmake yasm nasm
          brew install wget

      - name: Build iOS xcframeworks
        working-directory: ffmpeg-kit-next
        run: |
          # Build only for arm64 and arm64-simulator to save time
          export ARCHS="arm64 arm64-simulator"
          
          ./ios.sh \
            --enable-lame \
            --enable-opus \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-dav1d \
            --enable-libwebp \
            --enable-kvazaar \
            --enable-openh264 \
            --enable-zimg \
            --enable-soxr
          
      - name: Package Release
        working-directory: ffmpeg-kit-next
        run: |
          mkdir -p release
          cp -r prebuilt/apple-ios-arm64/ffmpegkit.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libavcodec.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libavdevice.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libavfilter.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libavformat.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libavutil.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libswresample.xcframework release/
          cp -r prebuilt/apple-ios-arm64/libswscale.xcframework release/
          
          cd release
          zip -r ../ffmpeg-kit-ios-full-lgpl.zip *.xcframework
          cd ..
          shasum -a 256 ffmpeg-kit-ios-full-lgpl.zip > ffmpeg-kit-ios-full-lgpl.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-ios-full-lgpl
          path: |
            ffmpeg-kit-next/ffmpeg-kit-ios-full-lgpl.zip
            ffmpeg-kit-next/ffmpeg-kit-ios-full-lgpl.zip.sha256
