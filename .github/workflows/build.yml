name: Build FFmpegKit LGPL for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout FFmpegKitNext
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v8.1.1
          path: ffmpeg-kit-next

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build iOS xcframeworks
        working-directory: ffmpeg-kit-next
        run: |
          ./nix-ios.sh -p default -x \
            --enable-lame \
            --enable-opus \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-dav1d \
            --enable-libwebp \
            --enable-kvazaar \
            --enable-openh264 \
            --enable-videotoolbox \
            --enable-audiotoolbox
          
      - name: Package Release
        working-directory: ffmpeg-kit-next
        run: |
          mkdir -p release
          # FFmpegKitNext creates the output in prebuilt or build directories depending on the script, 
          # so we'll just zip all built xcframeworks found.
          find . -name "*.xcframework" -exec cp -R {} release/ \;
          
          cd release
          zip -r ../ffmpeg-kit-ios-full-lgpl.zip *.xcframework
          cd ..
          shasum -a 256 ffmpeg-kit-ios-full-lgpl.zip > ffmpeg-kit-ios-full-lgpl.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-ios-full-lgpl
          path: |
            ffmpeg-kit-next/ffmpeg-kit-ios-full-lgpl.zip
            ffmpeg-kit-next/ffmpeg-kit-ios-full-lgpl.zip.sha256
